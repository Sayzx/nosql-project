version: '3.8'

services:
  neo4j:
    image: neo4j:5.15-community
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_ACCEPT_LICENSE_AGREEMENT: eval
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - ./init_db.sh:/init_db.sh
      - ./setup_graph.cypher:/setup_graph.cypher
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474/db/neo4j/query"]
      interval: 15s
      timeout: 10s
      retries: 10

  init-db:
    image: neo4j:5.15-community
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_ACCEPT_LICENSE_AGREEMENT: eval
    depends_on:
      neo4j:
        condition: service_started
    volumes:
      - ./setup_graph.cypher:/setup_graph.cypher
    command: bash -c "until cypher-shell -u neo4j -p password123 -a neo4j://neo4j:7687 'RETURN 1'; do echo 'Waiting for Neo4j...'; sleep 2; done; cypher-shell -u neo4j -p password123 -a neo4j://neo4j:7687 < /setup_graph.cypher"
    networks:
      - default

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
      NODE_ENV: development
    ports:
      - "5000:5000"
    depends_on:
      neo4j:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  neo4j_data:

networks:
  default:
    driver: bridge
